<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoLab Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth" class="auth-wrap hidden">
  <div class="auth-card">
    <h1>GoLab <span>admin console</span></h1>
    <p class="muted">Tokens are pre-provisioned by operators (<span class="mono">glab_admin_…</span>). There is no login endpoint.</p>
    <label class="field">Server base URL
      <input id="auth-url" placeholder="blank = same origin (relative paths)" spellcheck="false"></label>
    <label class="field">Admin token
      <input id="auth-token" type="password" placeholder="glab_admin_…" autocomplete="off" spellcheck="false"></label>
    <div id="auth-error" class="err-text"></div>
    <button class="btn primary grow" id="btn-connect">Connect</button>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">GoLab <span>admin</span></div>
    <nav id="nav">
      <button data-view="flags" class="active">Flags</button>
      <button data-view="segments">Segments</button>
      <button data-view="experiments">Experiments</button>
      <button data-view="debug">Debug</button>
      <button data-view="tokens">Tokens</button>
      <button data-view="audit">Audit</button>
      <button data-view="ai" id="nav-ai">AI Resources</button>
    </nav>
    <div class="side-foot"><button class="btn sm grow" id="btn-reauth">Change connection…</button></div>
  </aside>
  <div class="maincol">
    <header class="topbar">
      <label class="inline">Workspace <select id="sel-ws"></select></label>
      <button class="btn sm" id="btn-new-ws" title="New workspace">+</button>
      <label class="inline">Environment <select id="sel-env"></select></label>
      <button class="btn sm" id="btn-new-env" title="New environment">+</button>
      <span id="conn-info" class="conn muted"></span>
    </header>
    <main id="main"></main>
  </div>
</div>

<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
