<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grayling Console</title>
<script>
/* Set data-theme before first paint so the console never flashes the wrong
 * theme. Mirrors the resolve() logic in src/hooks/useTheme.ts exactly. */
(function () {
  var pref = 'system';
  try {
    var saved = localStorage.getItem('grayling_theme');
    if (saved === 'light' || saved === 'dark') pref = saved;
  } catch (e) { /* storage unavailable */ }
  var resolved = pref === 'system'
    ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
    : pref;
  document.documentElement.dataset.theme = resolved;
})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
