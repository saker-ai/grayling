# Replace the image references and namespace with deployment values. Create
# golab-native-secrets (pg-dsn, redis-addr, auth-secret) and golab-native-tls
# (tls.crt, tls.key) separately; never put secret values in this manifest.
apiVersion: v1
kind: Service
metadata:
  name: golab-native-headless
  namespace: golab
spec:
  clusterIP: None
  selector: {app: golab-native}
  ports:
    - {name: api, port: 8688, targetPort: api}
    - {name: native-http, port: 8848, targetPort: native-http}
    - {name: native-grpc, port: 9848, targetPort: native-grpc}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: golab-native
  namespace: golab
spec:
  serviceName: golab-native-headless
  replicas: 2
  selector:
    matchLabels: {app: golab-native}
  template:
    metadata:
      labels: {app: golab-native}
    spec:
      hostNetwork: false
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: golab-native}
      containers:
        - name: golab
          image: registry.example.invalid/golab:replace-with-reviewed-digest
          env:
            - name: PG_DSN
              valueFrom: {secretKeyRef: {name: golab-native-secrets, key: pg-dsn}}
            - name: REDIS_ADDR
              valueFrom: {secretKeyRef: {name: golab-native-secrets, key: redis-addr}}
          args:
            - -addr=0.0.0.0:8688
            - -pg=$(PG_DSN)
            - -redis=$(REDIS_ADDR)
            - -auth-secret-file=/run/golab/auth-secret
            - -gonacos-addr=127.0.0.1:18848
            - -gonacos-grpc-addr=127.0.0.1:19848
            - -nacos-native-auth=true
          ports:
            - {name: api, containerPort: 8688}
          readinessProbe:
            httpGet: {path: /api/v1/health, port: api}
          volumeMounts:
            - {name: auth-secret, mountPath: /run/golab, readOnly: true}
        - name: native-tls-l4
          image: registry.example.invalid/golab-native-proxy:replace-with-reviewed-digest
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports:
            - {name: native-http, containerPort: 8848}
            - {name: native-grpc, containerPort: 9848}
          readinessProbe:
            tcpSocket: {port: native-grpc}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: auth-secret
          secret: {secretName: golab-native-secrets, defaultMode: 384, items: [{key: auth-secret, path: auth-secret}]}
        - name: tls
          secret: {secretName: golab-native-tls}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: golab-native-ingress
  namespace: golab
spec:
  podSelector:
    matchLabels: {app: golab-native}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: golab-native-clients}
          podSelector:
            matchLabels: {native-access: allowed}
      ports:
        - {protocol: TCP, port: 8848}
        - {protocol: TCP, port: 9848}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: golab-admin}
      ports:
        - {protocol: TCP, port: 8688}
