name: Go quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: "off"
      GOLAB_TEST_PG_SKIP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - name: Core tests with race detection
        run: go test -race -count=1 ./ ./cmd/... ./internal/... ./pkg/... ./web
      - name: Binary boot and end-to-end tests
        run: go test -count=1 ./test/boot ./test/e2e ./test/smoke

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: "off"
      GOLAB_TEST_PG_DSN: postgres://postgres:golab-test@127.0.0.1:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: golab-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: GORM PostgreSQL replica and report tests
        run: >-
          go test -race -count=1 -timeout=15m
          ./internal/platform ./internal/experiment ./internal/api
          -run 'TestGORMPostgres|TestPostgresReport|TestQuotaAdminReplicaRead'
      - name: PostgreSQL full-stack acceptance
        run: go test -count=1 -timeout=10m ./test/e2e -run '^TestE2EPostgres'

  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: python3 -m pip install -e './sdk/python[test]'
      - run: python3 -m pytest sdk/python/tests -q
      - run: npm ci --prefix sdk/typescript
      - run: npm run typecheck --prefix sdk/typescript
      - run: npm test --prefix sdk/typescript
