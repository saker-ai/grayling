[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "golab-sdk"
version = "0.1.0"
description = "GoLab feature-flag & experiment SDK for Python — remote evaluation with config cache/polling and collect-contract event reporting"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["golab_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
