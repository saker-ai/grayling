syntax = "proto3";
package grayling.agent.v1;
option go_package = "github.com/saker-ai/grayling/api/agent/v1;agentv1";

// No RPC service: the initial transport is one binary Envelope per WebSocket
// message with subprotocol grayling.agent.v1. Field numbers are permanent.
message Envelope {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string session_id = 3;
  uint64 connection_epoch = 4;
  string message_id = 5;
  string reply_to = 6;
  string operation_id = 7;
  string subscription_id = 8;
  ResourceKind resource_kind = 9;
  string resource_key = 10;
  uint64 stream_seq = 11;
  uint64 resource_revision = 12;
  int64 deadline_unix_ms = 13;
  oneof payload {
    Hello hello = 20;
    Welcome welcome = 21;
    Heartbeat heartbeat = 22;
    HeartbeatAck heartbeat_ack = 23;
    Goodbye goodbye = 24;
    GoAway go_away = 25;
    Error error = 26;
    Subscribe subscribe = 30;
    Unsubscribe unsubscribe = 31;
    Resume resume = 32;
    Snapshot snapshot = 33;
    Delta delta = 34;
    Invalidated invalidated = 35;
    ResyncRequired resync_required = 36;
    Register register = 40;
    RenewLease renew_lease = 41;
    UpdateInstance update_instance = 42;
    Deregister deregister = 43;
    Registered registered = 44;
    LeaseRenewed lease_renewed = 45;
    InstanceChanged instance_changed = 46;
    FetchResource fetch_resource = 50;
    ResourceApplied resource_applied = 51;
    ResourceRejected resource_rejected = 52;
    ResourceRef resource_ref = 53;
    ConfigInvalidated config_invalidated = 54;
    Prepared prepared = 60;
    Applied applied = 61;
    Rejected rejected = 62;
    ReleaseStatusQuery release_status_query = 63;
    Prepare prepare = 64;
    Activate activate = 65;
    Abort abort = 66;
    Revoke revoke = 67;
    ReleaseStatus release_status = 68;
    ReadinessReport readiness_report = 70;
    DrainReport drain_report = 71;
    DrainRequested drain_requested = 72;
    DrainStatus drain_status = 73;
    EventBatch event_batch = 80;
    EventBatchAck event_batch_ack = 81;
  }
}

enum ResourceKind {
  RESOURCE_KIND_UNSPECIFIED = 0;
  RESOURCE_KIND_POLICY = 1;
  RESOURCE_KIND_DISCOVERY = 2;
  RESOURCE_KIND_BUNDLE = 3;
  RESOURCE_KIND_REVOCATION = 4;
}
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNAUTHENTICATED = 1;
  ERROR_CODE_PERMISSION_DENIED = 2;
  ERROR_CODE_CONFLICT = 3;
  ERROR_CODE_STALE_REVISION = 4;
  ERROR_CODE_FENCED = 5;
  ERROR_CODE_RESYNC_REQUIRED = 6;
  ERROR_CODE_RESOURCE_EXPIRED = 7;
  ERROR_CODE_NOT_READY = 8;
  ERROR_CODE_BACKEND_UNAVAILABLE = 9;
  ERROR_CODE_RATE_LIMITED = 10;
  ERROR_CODE_UNSUPPORTED_MESSAGE = 11;
  ERROR_CODE_INVALID_ARGUMENT = 12;
  ERROR_CODE_DEADLINE_EXCEEDED = 13;
}
message Scope {
  string workspace_id = 1;
  string environment_id = 2;
  string service_key = 3;
}
message Cursor {
  ResourceKind kind = 1;
  string key = 2;
  uint64 revision = 3;
  string sha256 = 4;
  bytes resume_token = 5;
}
message Hello {
  uint32 min_minor = 1;
  uint32 max_minor = 2;
  repeated string capabilities = 3;
  repeated string required_capabilities = 4;
  string agent_id = 5;
  string instance_id = 6;
  string boot_id = 7;
  repeated Cursor cursors = 8;
}
message Limits {
  uint32 max_frame_bytes = 1;
  uint32 max_subscriptions = 2;
  uint32 heartbeat_interval_ms = 3;
  uint32 heartbeat_timeout_ms = 4;
  uint32 lease_ttl_ms = 5;
  uint32 lease_renew_interval_ms = 6;
  uint64 max_resource_bytes = 7;
  uint32 control_queue_items = 8;
  uint32 resource_queue_items = 9;
  uint32 telemetry_queue_items = 10;
  uint64 queue_bytes = 11;
  uint32 max_events_per_batch = 12;
  uint32 messages_per_second = 13;
}
message Welcome {
  Scope scope = 1;
  int64 server_unix_ms = 2;
  repeated string capabilities = 3;
  Limits limits = 4;
  uint64 control_plane_epoch = 5;
}
// Heartbeats acknowledge link health only; they never extend leases or policy
// authorization. Lease renewal is an independent fenced operation.
message Heartbeat { uint64 nonce = 1; }
message HeartbeatAck { uint64 nonce = 1; int64 server_unix_ms = 2; }
message Goodbye { string reason = 1; }
message GoAway { string reason = 1; uint32 retry_after_ms = 2; int64 close_unix_ms = 3; }
message Error { ErrorCode code = 1; string reason = 2; bool retryable = 3; uint32 retry_after_ms = 4; }
message Subscribe { Scope scope = 1; Cursor cursor = 2; }
message Unsubscribe {}
message Resume { bytes token = 1; }
message Snapshot {
  Scope scope = 1;
  uint64 revision = 2;
  oneof content { SignedResource inline_resource = 3; ResourceRef reference = 4; }
}
// Delta is an invalidation hint with an exact base; clients unable to apply it
// must fetch a complete snapshot, never advance a cursor on receipt alone.
message Delta { uint64 base_revision = 1; ResourceRef reference = 2; }
message Invalidated { uint64 revision = 1; }
message ResyncRequired { string reason = 1; }
message Instance {
  Scope scope = 1;
  string instance_id = 2;
  string boot_id = 3;
  string build_id = 4;
  string image_digest = 5;
  string address = 6;
  uint32 port = 7;
  string tls_server_name = 8;
  string zone = 9;
  uint32 protocol_version = 10;
  bool ready = 11;
  bool draining = 12;
  Lease lease = 13;
}
message Lease { string id = 1; uint64 epoch = 2; int64 expires_unix_ms = 3; }
message Register { Instance instance = 1; bytes deployment_authorization = 2; }
message RenewLease { string instance_id = 1; string boot_id = 2; Lease lease = 3; }
message UpdateInstance { Instance instance = 1; }
message Deregister { string instance_id = 1; string boot_id = 2; Lease lease = 3; }
message Registered { Instance instance = 1; uint64 discovery_revision = 2; }
message LeaseRenewed { Lease lease = 1; uint64 discovery_revision = 2; }
message InstanceChanged { Instance instance = 1; bool removed = 2; }
message FetchResource { ResourceKind kind = 1; string key = 2; uint64 revision = 3; }
message ResourceApplied { uint64 revision = 1; string sha256 = 2; }
message ResourceRejected { uint64 revision = 1; Error error = 2; }
message ResourceRef {
  Scope scope = 1;
  ResourceKind kind = 2;
  string key = 3;
  uint64 revision = 4;
  string https_url = 5;
  string sha256 = 6;
  uint64 size_bytes = 7;
  int64 expires_unix_ms = 8;
}
// Signature input is the exact stored claims bytes, prefixed by the frozen
// domain separator. Protobuf serialization itself is NOT canonical encoding.
message SignedResource {
  bytes claims = 1;
  bytes payload = 2;
  string key_id = 3;
  bytes signature = 4;
}
message ConfigInvalidated { uint64 revision = 1; }
message ReleaseIdentity { string release_id = 1; uint64 generation = 2; string bundle_hash = 3; }
message Prepared {
  ReleaseIdentity release = 1;
  string instance_id = 2;
  string boot_id = 3;
  string build_id = 4;
  uint32 accepted_protocol_version = 5;
  int64 prepared_unix_ms = 6;
  int64 expires_unix_ms = 7;
  uint64 applied_generation = 8;
}
message Applied {
  ReleaseIdentity release = 1;
  string instance_id = 2;
  string boot_id = 3;
  uint64 policy_revision = 4;
  uint64 discovery_revision = 5;
  uint64 prepared_revision = 6;
  uint64 revocation_epoch = 7;
}
message Rejected { ReleaseIdentity release = 1; Error error = 2; }
message ReleaseStatusQuery { string release_id = 1; string operation_id = 2; }
message Prepare { ReleaseIdentity release = 1; ResourceRef bundle = 2; int64 expires_unix_ms = 3; }
message Activate { ReleaseIdentity release = 1; uint64 policy_revision = 2; uint64 prepared_revision = 3; }
message Abort { ReleaseIdentity release = 1; string reason = 2; }
message Revoke { uint64 epoch = 1; repeated string bundle_hashes = 2; bool cancel_active_streams = 3; }
enum ReleaseState {
  RELEASE_STATE_UNSPECIFIED = 0;
  RELEASE_STATE_DRAFT = 1;
  RELEASE_STATE_VALIDATED = 2;
  RELEASE_STATE_PREPARING = 3;
  RELEASE_STATE_PREPARED = 4;
  RELEASE_STATE_ACTIVATING = 5;
  RELEASE_STATE_VERIFYING = 6;
  RELEASE_STATE_ACTIVE = 7;
  RELEASE_STATE_FAILED = 8;
  RELEASE_STATE_ABORTED = 9;
  RELEASE_STATE_ROLLBACK_PREPARING = 10;
  RELEASE_STATE_ROLLBACK_VERIFYING = 11;
  RELEASE_STATE_ROLLED_BACK = 12;
}
message ReleaseStatus { ReleaseIdentity release = 1; ReleaseState state = 2; repeated Applied applied = 3; repeated Rejected rejected = 4; }
message ReadinessReport { string instance_id = 1; string boot_id = 2; bool ready = 3; string reason = 4; }
message DrainReport { string instance_id = 1; string boot_id = 2; uint64 active_streams = 3; uint64 forced_closes = 4; bool complete = 5; }
message DrainRequested { int64 stop_accepting_unix_ms = 1; int64 force_close_unix_ms = 2; }
message DrainStatus { bool complete = 1; uint64 active_streams = 2; }
message Event { string event_id = 1; string kind = 2; int64 occurred_unix_ms = 3; bytes payload = 4; }
message EventBatch { repeated Event events = 1; uint64 dropped_events = 2; }
message EventResult { string event_id = 1; bool accepted = 2; Error error = 3; }
message EventBatchAck { repeated EventResult results = 1; int64 dedup_expires_unix_ms = 2; }
