        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  "/api/v1/sdk/eval":
    post:
      tags: [sdk]
      summary: 远程求值（进入实验时服务端自动落幂等曝光）
      description: >-
        服务端求值并在结果进入 running 实验 split 时自行记录曝光（远端客户端
        不可信，不能自报曝光）。曝光 eventId 对
        (experiment, epoch, unit, variant) 确定性生成，重复远程求值幂等。
        响应中的 exposureEventId/randomizationUnit 仅在落了曝光时出现
        （omitempty）；randomizationUnit 回显的是调用方自己上下文里的规范
        单元字符串，供转化事件对齐同一 unit 哈希。
      operationId: evaluateSDK
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvalRequest"
      responses:
        "200":
          description: 求值结果。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  "/api/v1/sdk/decisions/{id}":
    get:
      tags: [sdk]
      summary: 查询当前进程保留的同作用域决策诊断
      description: >-
        SDK 凭证的工作空间和环境必须与决策一致。诊断只保留最近 10000 个决策，
        不包含原始随机化单元或求值上下文；进程重启后不保证可查。
      operationId: getSDKDecision
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
