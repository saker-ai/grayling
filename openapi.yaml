          description: 冻结的会话快照。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "501":
          $ref: "#/components/responses/AINotImplemented"
        "500":
          $ref: "#/components/responses/Internal"
  "/api/v1/sdk/ai/check":
    post:
      tags: [sdk, ai]
      summary: 执行前撤销门禁（即时阻断，不依赖快照同步）
      description: >-
        长任务在每个冻结资源执行前调用。任一资源被撤销 → HTTP 423，
        body 中 anyBlocked=true 且对应 resources 项带 blocked/reason，
        执行必须停止；全部通过 → 200。
      operationId: checkSDKAIResources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckRequest"
      responses:
        "200":
          description: 无阻断。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResponse"
        "423":
          description: 至少一个资源已被紧急撤销——停止执行。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "501":
          $ref: "#/components/responses/AINotImplemented"
        "500":
          $ref: "#/components/responses/Internal"
  "/api/v1/collect":
    post:
      tags: [collect]
      summary: 批量上报曝光/转化事件（collect 凭证）
      description: >-
        events[].unit 必填明文：服务端做租户内 HMAC-SHA256 伪名化后存储，
        原始 unit 不落盘；缺 unit 的事件跳过并计入 rejected（无随机化单元
        即无归因）。eventId 幂等去重，重复计入 duplicates。epoch 与实验注册
        不符、clientTime 迟到超 72h 或超前 5min → rejected（附原因）。
        批量条数与字节上限来自工作空间配额；超限 → 400 batch_too_large。
        空 events 数组返回全零结果。
      operationId: collectEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectRequest"
      responses:
        "200":
          description: 摄取统计。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  "/api/v1/admin/workspaces/{ws}/approvals":
