  "/api/v1/sdk/stream":
    get:
      tags: [sdk]
      summary: SSE revision 失效通知流
      description: >-
        text/event-stream。事件格式：`id: <manifest revision>`、
        `event: revision`、`data: {"revision":<int>,"scope":"<wsID>/<envID>"}`。
        连接建立即重放当前 revision（全量重同步语义：客户端对比自身缓存
        revision，更新则重拉快照），因此 Last-Event-ID 重连不需要服务端保留
        事件日志——该头被接受并记录，但当前 revision 重放已覆盖其语义。
        每 30s 发送注释心跳（": ping <unix>"）。通知是尽力而为的加速；
        SDK 仍需轮询兜底，丢失事件不会导致永久过期。每
        (workspace, environment) 连接数上限（默认 256）→ 503 sse_cap。
        响应头：Cache-Control: no-cache、Connection: keep-alive、
        X-Accel-Buffering: no。
      operationId: streamSDKRevisions
      parameters:
        - $ref: "#/components/parameters/LastEventIdHeader"
      responses:
        "200":
          description: SSE 流（长连接）。
          content:
            text/event-stream:
              schema:
                type: string
                description: >-
                  SSE 帧序列：`id: <revision>\nevent: revision\ndata:
                  {"revision":<int64>,"scope":"<workspaceId>/<environmentId>"}\n\n`，
                  以及每 30s 的注释心跳 `: ping <unix秒>\n\n`。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: 该作用域 SSE 连接数已达配额上限（code sse_cap）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/Internal"
