        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "501":
          $ref: "#/components/responses/AINotImplemented"
        "500":
          $ref: "#/components/responses/Internal"
  "/api/v1/sdk/ai/session":
    post:
      tags: [sdk, ai]
      summary: 会话冻结（一次求值 + 资源自动发现 + 摘要校验）
      description: >-
        为一次会话/任务冻结配置：对 flagKeys 逐个求值（进入实验时服务端落
        曝光），从被服务的 variation 值中自动发现 promptRef/resourceRef 与
        modelRef（modelRef 须过工作空间白名单），再解析并摘要校验全部资源。
        任一资源失败则整体失败——任务绝不在部分解析的配置上启动。长任务把
        返回的 SessionSnapshot 带在上下文里；新配置只影响后续会话。
      operationId: freezeSDKAISession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionFreezeRequest"
      responses:
