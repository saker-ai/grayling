          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  "/api/v1/admin/workspaces/{ws}/environments/{env}/approvals":
    post:
      tags: [workspaces]
      summary: 申请 release plan、AI pin 或计划回滚审批
      operationId: requestApproval
      parameters:
        - $ref: "#/components/parameters/WsPath"
        - $ref: "#/components/parameters/EnvPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalProposal"
      responses:
        "201":
          description: 已提交，含受影响范围、回滚目标、护栏和不可变摘要。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  "/api/v1/admin/workspaces/{ws}/environments/{env}/segments/{key}/preview":
    get:
      tags: [segments]
      summary: 发布前查看 segment 的变更摘要、目标环境、影响与回滚目标
      operationId: previewSegment
      parameters:
        - $ref: "#/components/parameters/WsPath"
        - $ref: "#/components/parameters/EnvPath"
        - $ref: "#/components/parameters/SegmentKeyPath"
      responses:
        "200":
          description: Segment 发布预览。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPreview"
  "/api/v1/admin/workspaces/{ws}/environments/{env}/flags/{key}/emergency-disable":
    post:
      tags: [flags]
      summary: owner 紧急关闭，发布 disable=true 新 revision 并生成异人事后复核
      operationId: emergencyDisableFlag
      parameters:
        - $ref: "#/components/parameters/WsPath"
        - $ref: "#/components/parameters/EnvPath"
        - $ref: "#/components/parameters/FlagKeyPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRequest"
      responses:
        "200":
          description: 含新 revision、manifest revision 和待复核 reviewId。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResult"
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: GoLab token (glab_admin_* / glab_sdk_* / glab_collect_*)
      description: >-
        Authorization: Bearer <token>。三受众互斥：admin（前缀 glab_admin_）
        仅可用于 /api/v1/admin/**；sdk（glab_sdk_）仅可用于
        /api/v1/sdk/**；collect（glab_collect_）仅可用于 /api/v1/collect。
        持错误受众的凭证 → 403 wrong_audience；缺失/无效/已吊销 →
        401 unauthorized。租户作用域（workspace/environment）由凭证本身
        决定，任何端点不接受 query/body 参数选择租户。admin 凭证另带角色
        （owner/publisher/analyst/viewer）做对象级 RBAC；每 token 固定窗口
        限流，超限 → 429 rate_limited。GET /api/v1/health 无鉴权。
  parameters:
    WsPath:
      name: ws
      in: path
      required: true
      description: 工作空间 slug 或内部 ID（两者皆可，服务端解析）。
      schema:
        type: string
    EnvPath:
      name: env
      in: path
      required: true
      description: 环境 slug 或内部 ID（两者皆可，服务端解析）。
      schema:
        type: string
    FlagKeyPath:
      name: key
      in: path
      required: true
      description: Flag key（与草稿 content.key 必须一致）。
      schema:
        type: string
    SegmentKeyPath:
      name: key
      in: path
      required: true
      description: Segment key（与草稿 content.key 必须一致）。
      schema:
        type: string
    TokenIdPath:
      name: id
      in: path
      required: true
      description: 凭证内部 ID（非 secret）。
      schema:
        type: string
    ExperimentIdPath:
      name: id
      in: path
      required: true
      description: 实验内部 ID。
      schema:
        type: string
    AITypePath:
      name: type
      in: path
      required: true
      description: AI 资源类型（注册仅接受 prompt/skill/agentspec）。
      schema:
        type: string
        enum: [prompt, skill, agentspec, mcp, pipeline]
    AILogicalPath:
      name: logical
      in: path
      required: true
      description: 资源逻辑 ID（[a-z0-9-] slug）。
      schema:
        type: string
    AuditLimitQuery:
      name: limit
      in: query
      required: false
      description: 返回条数上限；缺省 200，仅接受 1..1000（非法值忽略）。
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 200
    AIResolveTypeQuery:
      name: type
      in: query
      required: true
      description: AI 资源类型。
      schema:
        type: string
    AIResolveLogicalQuery:
      name: logicalId
      in: query
      required: true
      description: 资源逻辑 ID。
      schema:
        type: string
    AIResolveVersionQuery:
      name: version
      in: query
      required: false
      description: 指定版本；缺省解析当前 pin 的版本。
      schema:
        type: string
    IfNoneMatchHeader:
      name: If-None-Match
      in: header
      required: false
      description: 上次收到的 ETag；匹配当前 revision 时返回 304。
      schema:
        type: string
    LastEventIdHeader:
      name: Last-Event-ID
      in: header
      required: false
      description: >-
        SSE 重连时浏览器自动携带的最后事件 ID（= manifest revision）。
        服务端接受该头用于观测，但连接即重放当前 revision（全量重同步
        语义），不依赖事件日志回放。
      schema:
        type: string
  responses:
    BadRequest:
      description: >-
        400：validation_failed（含严格 JSON 解码失败/未知字段）、
        import_failed（gff 导入）、batch_too_large（采集批量超限）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 401 unauthorized：缺失、无效或已吊销的 bearer token。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: >-
        403：wrong_audience（受众不符）、access_denied（RBAC/对象级拒绝）、
        self_approval_denied（高风险草稿自批）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: >-
        404 not_found：对象不存在，或跨租户读取（AI 资源跨作用域一律 404，
        不泄露存在性）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: >-
        409：exists（重复创建）、conflict（乐观锁/摘要漂移）、
        invalid_state（非法状态迁移/资源已撤销）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: 429：rate_limited（每 token 限流）、quota_exceeded（工作空间配额）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AINotImplemented:
      description: 501 ai_unavailable：AI 资源服务未接入本 server 实例。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Internal:
      description: 500 internal：未分类服务端错误（另有 snapshot_invalid/encode/streaming_unsupported）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SubmitRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
    ApprovalProposal:
      type: object
      additionalProperties: false
      required: [action, object, payload, reason]
      properties:
        action:
          type: string
          enum: [release_plan.create, ai.pin, flag.rollback]
        object:
          type: string
          description: release plan 为 experiment ID，AI pin 为 type/logical，回滚为 flag key。
        payload:
          type: object
          description: 具体操作请求体；服务端解析并绑定规范化摘要。
        reason:
          type: string
    Approval:
      type: object
      required: [id, workspaceId, environmentId, action, object, payloadHash, baseRevision, risk, reason, state, submittedBy, submittedTokenId, submittedAt]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        environmentId: { type: string }
        action: { type: string }
        object: { type: string }
        payloadHash: { type: string }
        baseRevision: { type: integer, format: int64 }
        risk: { type: string, enum: [high] }
        reason: { type: string }
        impact: { type: string }
        rollbackTarget: { type: string }
        guardrails: { type: string }
        payload: { type: string, description: 非敏感操作参数；AI 原始内容不保存。 }
        state: { type: string, enum: [submitted, approved, used] }
        submittedBy: { type: string }
        submittedTokenId: { type: string }
        submittedAt: { type: string, format: date-time }
        approvedBy: { type: string }
        approvedTokenId: { type: string }
        approvedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        reviewNote: { type: string }
        usedAt: { type: string, format: date-time }
    ReviewPreview:
      type: object
      required: [targetEnvironment, risk, baseRevision, proposedHash, changedFields, estimatedAffected, rollbackTarget, guardrails]
      properties:
        targetEnvironment: { type: string }
        risk: { type: string, enum: [normal, high] }
        baseRevision: { type: integer, format: int64 }
        currentHash: { type: string }
        proposedHash: { type: string }
        changedFields: { type: array, items: { type: string } }
        estimatedAffected: { type: string }
        rollbackTarget: { type: string }
        guardrails: { type: string }
        approvalExpiresAt: { type: string, format: date-time }
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            机器可读错误码：unauthorized、wrong_audience、access_denied、
            self_approval_denied、not_found、exists、conflict、invalid_state、
            quota_exceeded、rate_limited、validation_failed、import_failed、
            batch_too_large、ai_unavailable、snapshot_invalid、encode、
            sse_cap、streaming_unsupported、internal。
        message:
          type: string
          description: 人类可读详情。
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    HealthResponse:
      type: object
      required: [status, service, schemaVersion]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: golab
        schemaVersion:
          type: integer
          description: 当前 DSL/快照 schema 代际（model.SchemaVersion = 1）。
          example: 1
    Workspace:
      type: object
      required: [id, slug, name, createdAt]
      properties:
        id:
          type: string
          description: 服务端生成的代理 ID（永不使用用户文本）。
        slug:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    Environment:
      type: object
      required: [id, workspaceId, slug, name, namespaceId, createdAt]
      properties:
        id:
          type: string
        workspaceId:
          type: string
        slug:
          type: string
        name:
          type: string
        namespaceId:
          type: string
          description: 该 (workspace, environment) 对应的 gonacos namespace（服务端生成）。
        createdAt:
          type: string
          format: date-time
    Token:
      type: object
      required: [id, name, kind, secretHash, prefix, createdAt, createdBy]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [admin, sdk, collect]
        role:
          type: string
          enum: [owner, publisher, analyst, viewer]
          description: 仅 admin 凭证（omitempty）。
        workspaceId:
          type: string
          description: 作用域；全局 owner admin 凭证为空（omitempty）。
        environmentId:
          type: string
          description: 仅 sdk/collect 凭证（omitempty）。
        secretHash:
          type: string
          description: secret 的 SHA-256（明文永不存储）。
        prefix:
          type: string
          description: 展示用明文前缀。
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        revoked:
          type: boolean
        createdBy:
          type: string
    CreatedToken:
      type: object
      description: >-
        仅创建时返回一次。注意：platform.CreatedToken 没有 json tag，
        因此 JSON 字段名是 Go 字段名 Token / Secret（大写开头）。
      required: [Token, Secret]
      properties:
        Token:
          $ref: "#/components/schemas/Token"
        Secret:
          type: string
          description: 明文 secret（glab_<kind>_<43 个 url-safe 字符>），此后不可再取。
    Quotas:
      type: object
      additionalProperties: false
      required:
        - maxFlags
        - maxFlagBytes
        - maxSegments
        - maxExperiments
        - maxEventBytes
        - maxEventsPerBatch
        - eventRetention
      properties:
        maxFlags:
          type: integer
        maxFlagBytes:
          type: integer
        maxSegments:
          type: integer
        maxExperiments:
          type: integer
        maxEventBytes:
          type: integer
        maxEventsPerBatch:
          type: integer
        eventRetention:
          type: integer
          format: int64
          description: Go time.Duration，整数纳秒。
    AuditEntry:
      type: object
      required: [id, time, actor, action]
      properties:
        id:
          type: integer
          format: int64
        time:
          type: string
          format: date-time
        actor:
          type: string
          description: 操作者（token 名称/ID）。
        actorRole:
          type: string
          enum: [owner, publisher, analyst, viewer]
        action:
          type: string
          description: 如 flag.publish、experiment.start、token.create、ai.revoke。
        workspaceId:
          type: string
        environmentId:
          type: string
        object:
          type: string
        detail:
          type: string
          description: JSON 字符串，可能已脱敏。
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string
    CreateEnvironmentRequest:
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string
    CreateTokenRequest:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [admin, sdk, collect]
        role:
          type: string
          enum: [owner, publisher, analyst, viewer]
          description: kind=admin 时必填；不能铸造全局 owner（workspaceId 恒为路径工作空间）。
        environment:
          type: string
          description: kind=sdk/collect 时必填：环境 slug 或 ID。
    TokenRevokeResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: revoked
    Flag:
      type: object
      description: GoLab Flag DSL（schemaVersion 1）。
      required: [schemaVersion, key, type, variations, defaultRule]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        key:
          type: string
        type:
          type: string
          enum: [bool, string, number, json]
        disable:
          type: boolean
          description: 急停开关；禁用时按 defaultRule 出值，reason=DISABLED。
        version:
          type: string
          description: GoLab 发布 revision（信息性；权威值在 manifest）。
        bucketing:
          $ref: "#/components/schemas/Bucketing"
        fields:
          type: array
          description: >-
            注册的上下文字段白名单：所有约束字段（含引用 segment 的）与
            bucketing unit 必须在此；targetingKey 隐式注册。
          items:
            type: string
        variations:
          type: object
          description: 变体名 → 值；值必须匹配 type（json 接受任意值）。
          additionalProperties: true
        defaultRule:
          $ref: "#/components/schemas/Rule"
        targeting:
          type: array
          description: 按序匹配，首个命中生效。
          items:
            $ref: "#/components/schemas/Rule"
        experiment:
          $ref: "#/components/schemas/ExperimentBinding"
    Bucketing:
      type: object
      required: [algorithm, unit]
      properties:
        algorithm:
          type: string
          enum: [golab-fnv1a-10000-v1]
        unit:
          type: string
          description: 提供随机化单元的上下文字段；更改须开新实验 epoch。
        salt:
          type: string
          description: 哈希域分隔；更改须开新 epoch。
    Rule:
      type: object
      description: >-
        targeting 规则或 defaultRule。variation 与 percentage 必须有且仅有
        其一；约束 AND 组合，引用 segment 之间 OR、与约束 AND；disable 的
        规则被跳过。
      properties:
        name:
          type: string
        disable:
          type: boolean
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/Constraint"
        segments:
          type: array
          items:
            type: string
        percentage:
          type: object
          description: 变体名 → 百分比（和为 100）。
          additionalProperties:
            type: number
        variation:
          type: string
    Constraint:
      type: object
      required: [field, op]
      properties:
        field:
          type: string
          description: 必须在 Flag.fields 注册（targetingKey 隐式注册）。
        op:
          type: string
          description: 闭集操作符；未知操作符校验期拒绝。
          enum:
            - eq
            - ne
            - in
            - not_in
            - gt
            - gte
            - lt
            - lte
            - time_before
            - time_after
            - regex
            - in_cidr
            - semver_gt
            - semver_gte
            - semver_lt
            - semver_lte
            - semver_eq
        value:
          description: 标量操作符（eq/ne/gt/…/regex/in_cidr/semver_*/time_*）的操作数。
        values:
          type: array
          description: 集合操作符（in/not_in）的操作数列表。
          items: {}
    ExperimentBinding:
      type: object
      required: [id, epoch, state]
      properties:
        id:
          type: string
        epoch:
          type: integer
          format: int64
        layer:
          type: string
          description: 互斥层 ID（空 = 无层）。
        layerSlot:
          $ref: "#/components/schemas/BucketRange"
        eligibility:
          type: number
          description: 入组百分比 [0,100]；0/未设 = 100。独立的 eligibility 哈希坐标。
        state:
          $ref: "#/components/schemas/ExperimentState"
        bandit:
          $ref: "#/components/schemas/BanditBinding"
    BanditBinding:
      type: object
      description: 已发布、不可变的策略状态；旧 SDK 忽略它并使用注册固定比例。
      required: [policyVersion, strategy, variants, priorAlpha, priorBeta, stateVersion, watermark, trials, successes]
      properties:
        policyVersion: { type: string }
        strategy: { type: string, enum: [thompson, epsilon-greedy] }
        variants: { type: array, items: { type: string } }
        priorAlpha: { type: number }
        priorBeta: { type: number }
        epsilon: { type: number }
        stateVersion: { type: integer, format: int64 }
        watermark: { type: string, format: date-time }
        trials: { type: array, items: { type: integer, format: int64 } }
        successes: { type: array, items: { type: integer, format: int64 } }
        frozen: { type: boolean }
        freezeReason: { type: string }
    BucketRange:
      type: object
      description: "[0,10000) 内的半开桶区间 [start, end)。"
      required: [start, end]
      properties:
        start:
          type: integer
        end:
          type: integer
    ExperimentState:
      type: string
      enum: [draft, reviewed, scheduled, running, paused, stopped, analyzed, archived]
    Segment:
      type: object
      description: 可复用、带版本的受众定义；约束 AND、嵌套 segment OR，环拒绝、深度有界。
      required: [schemaVersion, key]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        key:
          type: string
        version:
          type: string
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/Constraint"
        segments:
          type: array
          items:
            type: string
    Manifest:
      type: object
      description: >-
        每 (workspace, environment) 的索引：SDK 订阅/轮询 manifest，再拉取
        其引用的不可变 per-revision 文档。所有被引用写入读回验证后才发布；
        删除以 tombstone 呈现。
      required: [schemaVersion, workspace, environment, revision, generatedAt, flags]
      properties:
        schemaVersion:
          type: integer
        workspace:
          type: string
          description: 代理 ID（喂给分桶哈希坐标，防改名）。
        environment:
          type: string
        workspaceSlug:
          type: string
          description: 仅展示。
        environmentSlug:
          type: string
        revision:
          type: integer
          format: int64
        generatedAt:
          type: string
          format: date-time
        flags:
          type: array
          items:
            $ref: "#/components/schemas/ManifestEntry"
        segments:
          type: array
          items:
            $ref: "#/components/schemas/ManifestEntry"
    ManifestEntry:
      type: object
      required: [key, revision, dataId, hash]
      properties:
        key:
          type: string
        revision:
          type: integer
          format: int64
        dataId:
          type: string
          description: 承载文档的 gonacos dataId，如 golab.flag.<key>.r<revision>。
        hash:
          type: string
          description: 文档规范 JSON 编码的 SHA-256 hex。
        deleted:
          type: boolean
          description: tombstone：客户端必须从缓存逐出该 key。
    Snapshot:
      type: object
      description: >-
        求值器工作的原子单元：一个 manifest revision 及其全部被引用文档
        （已下载、哈希验证、解析）。禁止部分混合多个 manifest revision。
      required:
        - schemaVersion
        - workspace
        - environment
        - manifestRevision
        - generatedAt
        - flags
      properties:
        schemaVersion:
          type: integer
        workspace:
          type: string
          description: 代理 ID（哈希坐标）。
        environment:
          type: string
        workspaceSlug:
          type: string
        environmentSlug:
          type: string
        manifestRevision:
          type: integer
          format: int64
        generatedAt:
          type: string
          format: date-time
        flags:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Flag"
        segments:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Segment"
    EvaluationContext:
      type: object
      description: >-
        随机化单元与定向属性。targetingKey 必须是稳定的、已认证的或服务端
        生成的身份——求值器绝不凭空发明。
      properties:
        targetingKey:
          type: string
        attributes:
          type: object
          additionalProperties: true
    Exposure:
      type: object
      description: 应当上报的实验分配。
      required: [experimentId, epoch, variant, source]
      properties:
        experimentId:
          type: string
        epoch:
          type: integer
          format: int64
        variant:
          type: string
        source:
          type: string
          description: 到达该臂的方式；bandit 为自适应概率分流，split 为注册固定比例。
          enum: [split, bandit, bandit-fallback, targeting, default]
        policyVersion: { type: string }
        stateVersion: { type: integer, format: int64 }
        allocationProbability: { type: number, minimum: 0, maximum: 1 }
    Result:
      type: object
      description: >-
        一次求值的结果。failed=true 的结果携带调用方默认值，绝不可解释为
        一次分配。
      required: [flagKey, value, variationType, reason, failed, trackEvents]
      properties:
        flagKey:
          type: string
        value:
          description: 变体值（任意 JSON）。
        variationType:
          type: string
        reason:
          type: string
          enum:
            - DEFAULT
            - TARGETING_MATCH
            - SPLIT
            - DISABLED
            - ERROR
            - NOT_ENROLLED
            - EXPERIMENT_NOT_RUNNING
            - STALE
        errorCode:
          type: string
          enum: [FLAG_NOT_FOUND, MISSING_BUCKET_KEY, TYPE_MISMATCH, PARSE_ERROR, GENERAL]
          description: 无错误时省略（omitempty）。
        errorDetails:
          type: string
        failed:
          type: boolean
        flagVersion:
          type: string
        trackEvents:
          type: boolean
          description: true 且带 experiment 时应上报曝光。
        experiment:
          $ref: "#/components/schemas/Exposure"
        bucket:
          type: integer
          description: 命中的桶（未使用时为 -1；0 是有效桶）。
        rule:
          type: string
          description: 命中的规则名，匿名规则为 targeting[index]，默认规则为 default。
        decisionId:
          type: string
          description: 单次求值的不可猜测关联 ID。
        manifestRevision:
          type: integer
          format: int64
        snapshotAgeMillis:
          type: integer
          format: int64
          description: 当前快照生成后经过的毫秒数。
        exposureEventId:
          type: string
          description: 本次决策产生的曝光事件 ID；未曝光时省略。
    DecisionDiagnostic:
      type: object
      required: [result, exposureStatus, conversionCount]
      properties:
        result:
          $ref: "#/components/schemas/Result"
        exposureStatus:
          type: string
          enum: [none, queued, submitted, recorded, dropped]
        conversionCount:
          type: integer
          format: int64
        conversionsTruncated:
          type: boolean
          description: 单次决策的转化去重计数达到 1024 上限。
    FlagDraft:
      type: object
      required:
        - workspaceId
        - environmentId
        - key
        - content
        - state
        - risk
        - updatedBy
        - updatedAt
        - baseRevision
      properties:
        workspaceId:
          type: string
        environmentId:
          type: string
        key:
          type: string
        content:
          $ref: "#/components/schemas/Flag"
        state:
          type: string
          enum: [editing, submitted, approved]
        risk:
          type: string
          enum: [normal, high]
          description: high 草稿禁止提交人自批。
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
        submittedBy:
          type: string
        submittedAt:
          type: string
          format: date-time
          nullable: true
        approvedBy:
          type: string
        approvedAt:
          type: string
          format: date-time
          nullable: true
        reviewNote:
          type: string
        deleted:
          type: boolean
          description: 待发布 tombstone。
        baseRevision:
          type: integer
          format: int64
          description: 乐观锁：本草稿编辑所基于的 revision。
    FlagRevision:
      type: object
      description: 一个不可变的已发布 revision。
      required:
        - workspaceId
        - environmentId
        - key
        - revision
        - content
        - hash
        - dataId
        - publishedAt
        - publishedBy
      properties:
        workspaceId:
          type: string
        environmentId:
          type: string
        key:
          type: string
        revision:
          type: integer
          format: int64
        content:
          $ref: "#/components/schemas/Flag"
        hash:
          type: string
          description: 规范 JSON 的 SHA-256。
        dataId:
          type: string
          description: gonacos dataId（不可变）。
        publishedAt:
          type: string
          format: date-time
        publishedBy:
          type: string
        note:
          type: string
        rollbackOf:
          type: integer
          format: int64
          description: 该 manifest 状态有意重指的旧 revision（回滚不产生新内容）。
    SegmentDraft:
      type: object
      required:
        - workspaceId
        - environmentId
        - key
        - content
        - state
        - risk
        - updatedBy
        - updatedAt
        - baseRevision
      properties:
        workspaceId:
          type: string
        environmentId:
          type: string
        key:
          type: string
        content:
          $ref: "#/components/schemas/Segment"
        state:
          type: string
          enum: [editing, submitted, approved]
        risk:
          type: string
          enum: [normal, high]
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
        submittedBy:
          type: string
        approvedBy:
          type: string
        baseRevision:
          type: integer
          format: int64
    FlagView:
      type: object
      description: 控制台读模型：草稿 + 已发布状态。
      required: [key, currentRevision]
      properties:
        key:
          type: string
        draft:
          $ref: "#/components/schemas/FlagDraft"
        preview:
          $ref: "#/components/schemas/ReviewPreview"
        currentRevision:
          type: integer
          format: int64
          description: 0 = 尚无已发布 revision。
        current:
          $ref: "#/components/schemas/FlagRevision"
        revisions:
          type: array
          description: 全部历史（详情端点返回；列表端点可省略）。
          items:
            $ref: "#/components/schemas/FlagRevision"
    PublishResult:
      type: object
      required: [flagRevision, manifestRevision, hash, dataId]
      properties:
        flagRevision:
          type: integer
          format: int64
        manifestRevision:
          type: integer
          format: int64
        hash:
          type: string
        dataId:
          type: string
    SaveFlagDraftRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          allOf:
            - $ref: "#/components/schemas/Flag"
          description: content.key 必须等于路径 {key}（否则 400）。
        risk:
          type: string
          enum: [normal, high]
        baseRevision:
          type: integer
          format: int64
          description: ">0 启用乐观锁；落后于当前 revision → 409 conflict。"
    SaveSegmentDraftRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          allOf:
            - $ref: "#/components/schemas/Segment"
          description: content.key 必须等于路径 {key}（否则 400）。
        risk:
          type: string
          enum: [normal, high]
    NoteRequest:
      type: object
      additionalProperties: false
      description: 可选评审备注（body 可整体省略）。
      properties:
        note:
          type: string
    ReasonRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
    RollbackRequest:
      type: object
      additionalProperties: false
      required: [revision, reason]
      properties:
        revision:
          type: integer
          format: int64
          description: 目标历史 revision（须存在且读回哈希验证通过）。
        reason:
          type: string
        approvalId:
          type: string
          description: 计划回滚的审批记录；与 emergency 二选一。
        emergency:
          type: boolean
          description: owner 紧急回滚，强制原因与事后复核。
    ImportGffRequest:
      type: object
      additionalProperties: false
      required: [document, key, salt]
      properties:
        document:
          type: string
          description: gff flag 文档（YAML 或 JSON 原文）。
        key:
          type: string
        salt:
          type: string
    ImportGffResponse:
      type: object
      required: [flag, warnings, draft, note]
      properties:
        flag:
          $ref: "#/components/schemas/Flag"
        warnings:
          type: array
          items:
            type: string
        draft:
          $ref: "#/components/schemas/FlagDraft"
        note:
          type: string
          description: HIGH 风险策略说明。
    StateResponse:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [editing, submitted, approved]
          description: 迁移后的草稿状态。
    FlagDeleteResponse:
      type: object
      required: [status, next]
      properties:
        status:
          type: string
          example: marked-deleted
        next:
          type: string
          description: 后续流程提示（submit → approve → publish 落 tombstone）。
    DebugEvalRequest:
      type: object
      additionalProperties: false
      required: [flagKey, context]
      properties:
        flagKey:
          type: string
        context:
          $ref: "#/components/schemas/EvaluationContext"
    DebugEvalResponse:
      type: object
      required: [result, manifestRevision, note]
      properties:
        result:
          $ref: "#/components/schemas/Result"
        manifestRevision:
          type: integer
          format: int64
        note:
          type: string
          description: 调试求值永不记录曝光。
    MetricSpec:
      type: object
      description: >-
        实验主指标预注册。v1 支持 proportion 与 mean；P5（§10.3）新增 ratio、
        quantile 与 CUPED（带协变量的方差缩减 mean）。ratio/quantile/CUPED 的
        额外字段在此声明，均可预注册选用，SRM/护栏阻断对其同样生效。
      required: [key, type, direction]
      properties:
        key:
          type: string
        type:
          type: string
          enum: [proportion, mean, ratio, quantile]
        direction:
          type: string
          enum: [increase, decrease]
          description: 什么方向算"更好"。
        unit:
          type: string
        floor:
          type: number
          nullable: true
          description: mean 指标的取值下限钳制（缺省不钳制）。
        ceil:
          type: number
          nullable: true
        numeratorKey:
          type: string
          description: ratio 指标分子 metric key（缺省用 key 作分子）。
        denominatorKey:
          type: string
          description: ratio 指标分母 metric key（ratio 必填）。R = Σ分子/Σ分母。
        quantileLevel:
          type: number
          description: quantile 指标的分位点 p ∈ (0,1)（quantile 必填，如 0.95=p95）。
        covariateKey:
          type: string
          description: CUPED 实验前协变量 metric key（仅 mean 指标；设置且有配对数据时报告用 CUPED 调整检验）。
    GuardrailSpec:
      type: object
      description: 运营护栏规则，与主指标统计显著性分开评估。
      required: [metricKey, type, maxRelativeRegression, minSample]
      properties:
        metricKey:
          type: string
        type:
          type: string
          enum: [proportion, mean]
        direction:
          type: string
          enum: [increase, decrease]
          description: 该指标什么方向算好；缺省 increase。逆向超出阈值即违约。
        maxRelativeRegression:
          type: number
          description: 治疗臂相对控制臂的最大可接受回退比例（0.05 = 5%）。
        minSample:
          type: integer
          format: int64
          description: 样本低于此值不判违约（数据不足）。
    BanditSpec:
      type: object
      required: [policyVersion, strategy, priorAlpha, priorBeta, feedbackDelay]
      properties:
        policyVersion: { type: string }
        strategy: { type: string, enum: [thompson, epsilon-greedy] }
        priorAlpha: { type: number, exclusiveMinimum: 0 }
        priorBeta: { type: number, exclusiveMinimum: 0 }
        epsilon: { type: number, minimum: 0, exclusiveMaximum: 1 }
        feedbackDelay:
          type: integer
          format: int64
          description: 纳秒；至少 analysisWindow + 72h。
    Experiment:
      type: object
      additionalProperties: false
      description: >-
        预注册分析契约。创建请求必填：flagKey、unit、variants（≥2 且为 flag
        的 variation）、proportions（每变体 (0,100]，和=100）、primaryMetric
        （key/type/direction）、alpha ∈ (0,1)、analysisWindow > 0（纳秒）。
        服务端赋值：id、workspaceId、environmentId、flagRevision、epoch、
        layerSlot、state、时间戳、createdBy。更改随机化单元、指标定义、
        比例或资源绑定 = 新 epoch，历史永不覆写。显式 Holm 家族冻结于
        创建时，所有用于决策的多指标/多变体比较须放在同一家族。
      required: [flagKey, unit, variants, proportions, primaryMetric, alpha, analysisWindow]
      properties:
        id:
          type: string
        workspaceId:
          type: string
        environmentId:
          type: string
        flagKey:
          type: string
        flagRevision:
          type: integer
          format: int64
          description: 注册时所绑定的 flag revision。
        epoch:
          type: integer
          format: int64
          description: 自动分配、永不复用；0/缺省由服务端取下一个。
        unit:
          type: string
          description: 随机化单元的上下文字段名。
        layer:
          type: string
          description: 互斥层 ID（可选）。
        layerSlot:
          $ref: "#/components/schemas/BucketRange"
        eligibility:
          type: number
          description: 入组百分比；0 = 100。
        variants:
          type: array
          description: 显式稳定顺序；无 Holm 家族的旧报告要求恰好 2 臂，多臂须注册 Holm 家族。
          items:
            type: string
        proportions:
          type: object
          description: 变体名 → 百分比；(0,100]，总和 100。
          additionalProperties:
            type: number
        allocationMode:
          type: string
          enum: [fixed-split, bandit]
          description: 缺省 fixed-split；bandit 必须注册 bandit 策略。
        bandit:
          $ref: "#/components/schemas/BanditSpec"
        primaryMetric:
          $ref: "#/components/schemas/MetricSpec"
        guardrails:
          type: array
          items:
            $ref: "#/components/schemas/GuardrailSpec"
        holmFamily:
          $ref: "#/components/schemas/HolmFamily"
        registrationVersion:
          type: string
          description: 服务端生成的 SHA-256 注册契约版本；报告与创建审计均引用此值。
        alpha:
          type: number
          description: 显著性水平，(0,1)。
        power:
          type: number
        mde:
          type: number
          description: 最小可检测效应。
        minSamplePerArm:
          type: integer
          format: int64
        minRuntime:
          type: integer
          format: int64
          description: Go time.Duration，整数纳秒。
        analysisWindow:
          type: integer
          format: int64
          description: Go time.Duration，整数纳秒；必须 > 0。
        hypothesis:
          type: string
        analysisMethod:
          type: string
          enum: [welch, two-proportion-z, ratio-delta, quantile, cuped, bandit-beta-bernoulli]
          description: 预注册；缺省按 primaryMetric.type 推导（mean→welch，proportion→two-proportion-z）。
        releasePlan:
          $ref: "#/components/schemas/ReleasePlan"
        state:
          $ref: "#/components/schemas/ExperimentState"
        startedAt:
          type: string
          format: date-time
          nullable: true
        stoppedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
    HolmHypothesis:
      type: object
      additionalProperties: false
      required: [id, metric, control, treatment]
      properties:
        id: { type: string }
        metric:
          allOf:
            - $ref: "#/components/schemas/MetricSpec"
          description: 仅 mean 或 proportion；不支持 CUPED/ratio/quantile 等高级参数。
        control: { type: string }
        treatment: { type: string }
    HolmFamily:
      type: object
      additionalProperties: false
      required: [id, hypotheses]
      properties:
        id: { type: string }
        hypotheses:
          type: array
          minItems: 2
          maxItems: 100
          description: 首项须与 primaryMetric 和 variants[0:2] 完全一致；每个额外变体至少有一项。
          items:
            $ref: "#/components/schemas/HolmHypothesis"
    TransitionRequest:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to:
          $ref: "#/components/schemas/ExperimentState"
        reason:
          type: string
    ReleaseStep:
      type: object
      description: >-
        分阶段放量的一步。步骤只调整实验 eligibility；比例/单元/salt/绑定
        由预注册 epoch 固定。eligibility 哈希是前缀区间——提高 ratio 不会
        取消已入组单元。ratio 必须跨步骤严格递增。
      additionalProperties: false
      required: [name, ratio, minRuntime, autoAdvance]
      properties:
        name:
          type: string
        ratio:
          type: number
          description: 本步骤生效的实验 eligibility 百分比，(0,100]。
        minRuntime:
          type: integer
          format: int64
          description: 决策门可触发前的最小驻留时间（Go time.Duration，整数纳秒）。
        observationWindow:
          type: integer
          format: int64
          description: minRuntime 之后继续积累数据的观察窗（纳秒）。
        autoAdvance:
          type: boolean
          description: false = 引擎在步骤边界等待人工推进。
    ReleasePlanState:
      type: string
      enum: [armed, running, paused, completed, rolled_back]
    PlanEvent:
      type: object
      description: 计划操作历史的一条（自动与手动动作都追加；有界，新者在后）。
      required: [at, actor, action, step]
      properties:
        at:
          type: string
          format: date-time
        actor:
          type: string
          description: rollout-engine 或 admin token 名称。
        action:
          type: string
        step:
          type: integer
        detail:
          type: string
    ReleasePlan:
      type: object
      required: [steps, state, currentStep, createdAt, updatedAt, createdBy]
      properties:
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseStep"
        state:
          $ref: "#/components/schemas/ReleasePlanState"
        currentStep:
          type: integer
        stepStartedAt:
          type: string
          format: date-time
          nullable: true
          description: 当前步骤开始时刻（引擎时钟）。
        manualOverride:
          type: boolean
          description: 人工接管开关；true 时引擎不做任何自动动作。
        pausedReason:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        history:
          type: array
          description: 最近操作窗口（上限 64 条；完整轨迹在不可变审计日志）。
          items:
            $ref: "#/components/schemas/PlanEvent"
    ReleasePlanCreateRequest:
      type: object
      additionalProperties: false
      required: [steps]
      properties:
        steps:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReleaseStep"
        approvalId:
          type: string
          description: 与本次 steps 完全相同的有效审批记录 ID。
    TakeoverRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: true = 人工接管（引擎停止自动动作）；false = 交还引擎。
        reason:
          type: string
    Report:
      type: object
      description: >-
        一个实验 epoch 的分析输出。bandit-beta-bernoulli 只返回专用 bandit 后验段，
        不给出固定样本 p 值、CI 或胜出结论。
        分析人群是随机化子集；确定性 targeting/default 臂仅作展示，不进入
        主统计与 SRM。报告是纯读——不改实验状态。
        primary/sequential/bayesian 仅描述首组变体比较；多比较确认性判定见 holm。
      required:
        - experimentId
        - epoch
        - flagKey
        - state
        - generatedAt
        - analysisMethod
        - alpha
        - mde
        - control
        - treatment
        - healthy
        - perVariant
        - decision
        - minRuntimeSatisfied
      properties:
        experimentId:
          type: string
        epoch:
          type: integer
          format: int64
        flagKey:
          type: string
        state:
          $ref: "#/components/schemas/ExperimentState"
        generatedAt:
          type: string
          format: date-time
        analysisMethod:
          type: string
          enum: [welch, two-proportion-z, ratio-delta, quantile, cuped, bandit-beta-bernoulli]
        alpha:
          type: number
        mde:
          type: number
        control:
          type: string
          description: 对照臂变体名。
        treatment:
          type: string
          description: 治疗臂变体名。
        healthy:
          type: boolean
          description: 任一数据质量门失败即 false；不健康的报告绝不驱动 ship/rollback 自动化。
        healthIssues:
          type: array
          items:
            type: string
        srm:
          $ref: "#/components/schemas/SRMResult"
        perVariant:
          type: array
          items:
            $ref: "#/components/schemas/VariantReport"
        primary:
          $ref: "#/components/schemas/PrimaryResult"
        primaryError:
          type: string
        guardrails:
          type: array
          items:
            $ref: "#/components/schemas/GuardrailCheck"
        decision:
          $ref: "#/components/schemas/Decision"
        minRuntimeSatisfied:
          type: boolean
        sequential:
          allOf:
            - $ref: "#/components/schemas/SequentialResult"
          description: >-
            always-valid（mSPRT）序贯视图，用于持续监控；与固定样本 primary
            分离，绝不驱动 ship/rollback 决策门（§10.3）。仅 mean 指标计算。
        bayesian:
          allOf:
            - $ref: "#/components/schemas/BayesianSection"
          description: >-
            贝叶斯后验/期望损失/胜出概率视图，与频率派结论分离呈现，绝不与
            固定样本 95% CI 混成同一决策规则（§10.3）。
        bandit:
          $ref: "#/components/schemas/BanditSection"
        registrationVersion:
          type: string
          description: 预注册决策契约版本，与创建审计相同。
        holm:
          $ref: "#/components/schemas/HolmSection"
    HolmComparison:
      type: object
      required: [id, metric, control, treatment, rawP, adjustedP, effectiveAlpha, rank, rejected, diff, directedDiff, ciLow, ciHigh]
      properties:
        id: { type: string }
        metric: { $ref: "#/components/schemas/MetricSpec" }
        control: { type: string }
        treatment: { type: string }
        rawP: { type: number }
        adjustedP: { type: number }
        effectiveAlpha: { type: number }
        rank: { type: integer, minimum: 1 }
        rejected: { type: boolean }
        diff: { type: number }
        directedDiff: { type: number }
        ciLow: { type: number, description: 单项未调整置信区间下界。 }
        ciHigh: { type: number, description: 单项未调整置信区间上界。 }
    HolmSection:
      type: object
      required: [familyId, registrationVersion, alpha, comparisons]
      properties:
        familyId: { type: string }
        registrationVersion: { type: string }
        alpha: { type: number }
        comparisons:
          type: array
          items: { $ref: "#/components/schemas/HolmComparison" }
        error: { type: string, description: 某项检验无法计算时整个家族不作确认性判定。 }
    BanditSection:
      type: object
      required: [policyVersion, stateVersion, feedbackWatermark, trials, successes, posteriorMean, pending, missingFeedback, fallbackAssignments, srmAlarm, frozen]
      properties:
        policyVersion: { type: string }
        stateVersion: { type: integer, format: int64 }
        feedbackWatermark: { type: string, format: date-time }
        trials: { type: array, items: { type: integer, format: int64 } }
        successes: { type: array, items: { type: integer, format: int64 } }
        posteriorMean: { type: array, items: { type: number } }
        pending: { type: integer, format: int64 }
        missingFeedback: { type: integer, format: int64 }
        fallbackAssignments: { type: integer, format: int64 }
        srmAlarm: { type: boolean }
        frozen: { type: boolean }
        freezeReason: { type: string }
    VariantReport:
      type: object
      description: >-
        每臂体量。randomizedUnits 是 SRM 与主分析的分母；exposedUnits 另计
        经确定性规则到达该臂的单元（仅展示）。
      required: [variant, exposedUnits, randomizedUnits, exposures, convertedUnits, primaryValue]
      properties:
        variant:
          type: string
        exposedUnits:
          type: integer
          format: int64
        randomizedUnits:
          type: integer
          format: int64
        exposures:
          type: integer
          format: int64
        convertedUnits:
          type: integer
          format: int64
          description: 随机化单元中发生转化者。
        primaryValue:
          type: number
          description: 转化率或 per-unit 均值的均值。
    PrimaryResult:
      type: object
      required: [type, pValue, diff, relativeDiff, relativeMeaningful, ciLow, ciHigh, significant]
      properties:
        type:
          type: string
          enum: [welch, two-proportion-z, ratio-delta, quantile, cuped]
        pValue:
          type: number
        diff:
          type: number
        relativeDiff:
          type: number
        relativeMeaningful:
          type: boolean
          description: 基线接近零时 false——只应解读绝对差。
        ciLow:
          type: number
        ciHigh:
          type: number
        significant:
          type: boolean
        welch:
          $ref: "#/components/schemas/WelchResult"
        proportion:
          $ref: "#/components/schemas/ProportionResult"
        ratio:
          $ref: "#/components/schemas/RatioResult"
        quantile:
          $ref: "#/components/schemas/QuantileResult"
        cuped:
          $ref: "#/components/schemas/CUPEDResult"
        varianceReduction:
          type: number
          description: type=cuped 时的方差缩减比例（≈ρ²）。
    SRMResult:
      type: object
      description: 观测 per-variant 单元数对预注册分配的卡方拟合优度检验。
      required: [chiSquare, pValue, healthy, observed, expected]
      properties:
        chiSquare:
          type: number
        pValue:
          type: number
        healthy:
          type: boolean
          description: pValue >= 阈值（0.001）；不健康即 SRM 告警，查明原因前不得宣称胜者。
        observed:
          type: array
          items:
            type: number
        expected:
          type: array
          items:
            type: number
    WelchResult:
      type: object
      required:
        - meanA
        - meanB
        - diff
        - relativeDiff
        - varA
        - varB
        - na
        - nb
        - t
        - df
        - pValue
        - ciDiffLow
        - ciDiffHigh
        - significant
        - relativeMeaningful
      properties:
        meanA:
          type: number
        meanB:
          type: number
        diff:
          type: number
          description: meanB − meanA。
        relativeDiff:
          type: number
        varA:
          type: number
        varB:
          type: number
        na:
          type: integer
          format: int64
        nb:
          type: integer
          format: int64
        t:
          type: number
          description: 零方差退化情形可为 ±Inf。
        df:
          type: number
          description: Welch–Satterthwaite 自由度；未定义时报 0。
        pValue:
          type: number
        ciDiffLow:
          type: number
        ciDiffHigh:
          type: number
        significant:
          type: boolean
        relativeMeaningful:
          type: boolean
    ProportionResult:
      type: object
      required:
        - pa
        - pb
        - diff
        - relativeDiff
        - na
        - nb
        - xa
        - xb
        - z
        - pValue
        - ciDiffLow
        - ciDiffHigh
        - significant
        - relativeMeaningful
      properties:
        pa:
          type: number
        pb:
          type: number
        diff:
          type: number
          description: pb − pa。
        relativeDiff:
          type: number
        na:
          type: integer
          format: int64
        nb:
          type: integer
          format: int64
        xa:
          type: integer
          format: int64
        xb:
          type: integer
          format: int64
        z:
          type: number
        pValue:
          type: number
        ciDiffLow:
          type: number
        ciDiffHigh:
          type: number
        significant:
          type: boolean
        relativeMeaningful:
          type: boolean
    RatioResult:
      type: object
      description: >-
        ratio 指标的 delta-method 检验（R = Σ分子/Σ分母，逐随机化单元配对；
        Budylin et al. WSDM 2018）。
      properties:
        ratioA:
          type: number
        ratioB:
          type: number
        diff:
          type: number
          description: ratioB − ratioA。
        relativeDiff:
          type: number
        relativeMeaningful:
          type: boolean
        varA:
          type: number
          description: A 臂比值的 delta-method 方差。
        varB:
          type: number
        na:
          type: integer
          format: int64
        nb:
          type: integer
          format: int64
        se:
          type: number
        z:
          type: number
        pValue:
          type: number
        ciDiffLow:
          type: number
        ciDiffHigh:
          type: number
        significant:
          type: boolean
    QuantileResult:
      type: object
      description: >-
        quantile 指标：每臂分位数的分布式无关（二项/阶次统计）置信区间 +
        两样本渐近检验（KDE 密度估计）。尾部百分位（如 p95）在小样本下仅作诊断。
      properties:
        level:
          type: number
          description: 分位点 p（0.5=中位数，0.95=p95）。
        quantileA:
          type: number
        quantileB:
          type: number
        diff:
          type: number
          description: quantileB − quantileA。
        na:
          type: integer
          format: int64
        nb:
          type: integer
          format: int64
        ciALow:
          type: number
        ciAHigh:
          type: number
        ciBLow:
          type: number
        ciBHigh:
          type: number
        seA:
          type: number
        seB:
          type: number
        se:
          type: number
        z:
          type: number
        pValue:
          type: number
        ciDiffLow:
          type: number
        ciDiffHigh:
          type: number
        significant:
          type: boolean
    CUPEDResult:
      type: object
      description: >-
        CUPED 协方差调整（Deng et al. WSDM 2013）：用实验前协变量把方差缩减
        ≈ρ²，效应估计保持无偏。同时给出未调整的 rawDiff 以便审计。
      properties:
        meanYA:
          type: number
        meanYB:
          type: number
        rawDiff:
          type: number
          description: 未调整的均值差 meanYB − meanYA。
        theta:
          type: number
          description: 合并协方差调整系数 Cov(X,Y)/Var(X)。
        correlation:
          type: number
          description: 合并 corr(X,Y)；varianceReduction ≈ ρ²。
        diff:
          type: number
          description: CUPED 调整后的效应估计（对 rawDiff 无偏）。
        relativeDiff:
          type: number
        relativeMeaningful:
          type: boolean
        varianceReduction:
          type: number
          description: 1 − Var(Δ_adj)/Var(Δ_raw)，实际灵敏度增益，钳制到 [0,1]。
        varA:
          type: number
        varB:
          type: number
        na:
          type: integer
          format: int64
        nb:
          type: integer
          format: int64
        t:
          type: number
        df:
          type: number
        pValue:
          type: number
        ciDiffLow:
          type: number
        ciDiffHigh:
          type: number
        significant:
          type: boolean
    SequentialResult:
      type: object
      description: >-
        always-valid 序贯推断（Gaussian mixture mSPRT；Robbins 1970 / Johari et
        al. 2022）。p 值与置信序列在每一次查看都同时有效——多次查看不膨胀 I 型
        错误（§10.3）。与固定样本 primary 分离，不驱动决策门。
      properties:
        na:
          type: integer
          format: int64
        nb:
          type: integer
          format: int64
        diff:
          type: number
          description: 当前均值差估计 x̄_B − x̄_A。
        variance:
          type: number
          description: Diff 的方差 V = s²_A/n_A + s²_B/n_B。
        tau:
          type: number
          description: 预注册的混合尺度（备择先验的效应尺度，默认取 MDE）。
        logLambda:
          type: number
          description: 混合似然比 Λ 的自然对数（对 H0 的证据）。
        pValue:
          type: number
          description: anytime-valid p 值 min(1, 1/Λ)。
        csLow:
          type: number
          description: (1−alpha) 置信序列下界（时间一致有效）。
        csHigh:
          type: number
        significant:
          type: boolean
          description: pValue < alpha；因 p 值 anytime-valid，可在每次查看时判定而无偷看惩罚。
        alpha:
          type: number
    BayesianSection:
      type: object
      description: >-
        贝叶斯视图，结构上与频率派 primary/decision 分离，二者绝不合并为同一
        决策规则（§10.3）。按指标族填 mean 或 proportion 之一。
      properties:
        mean:
          $ref: "#/components/schemas/BayesianMeanResult"
        proportion:
          $ref: "#/components/schemas/BayesianProportionResult"
    BayesianMeanResult:
      type: object
      description: 均值差的 Normal-Normal 共轭后验摘要（胜出概率 + 期望损失 + 可信区间）。
      properties:
        postMeanDiff:
          type: number
        postSDDiff:
          type: number
        credibleLow:
          type: number
        credibleHigh:
          type: number
        probBSuperior:
          type: number
          description: P(μ_B > μ_A | data) 胜出概率。
        expectedLossB:
          type: number
          description: 选择 B 的期望损失 E[max(0, μ_A − μ_B) | data]。
        expectedLossA:
          type: number
        alpha:
          type: number
        na:
          type: integer
          format: int64
        nb:
          type: integer
          format: int64
        priorSDUsed:
          type: number
          description: 有效先验 SD（未显式给定时用弱信息默认 10×合并 SD）。
    BayesianProportionResult:
      type: object
      description: 转化率差的 Beta-Binomial 共轭后验摘要（精确后验 + 胜出概率 + 期望损失）。
      properties:
        postAA:
          type: number
        postAB:
          type: number
        postBA:
          type: number
        postBB:
          type: number
        postMeanA:
          type: number
        postMeanB:
          type: number
        probBSuperior:
          type: number
        expectedLossB:
          type: number
        expectedLossA:
          type: number
        credibleLowDiff:
          type: number
          description: p_B − p_A 的可信区间（后验差的正态近似，等尾）。
        credibleHighDiff:
          type: number
        alpha:
          type: number
        na:
          type: integer
          format: int64
        nb:
          type: integer
          format: int64
        xa:
          type: integer
          format: int64
        xb:
          type: integer
          format: int64
    GuardrailCheck:
      type: object
      description: >-
        一条护栏的评估结果。注意：Go 结构体 stats.GuardrailCheck 的
        Metric/Detail 字段没有 json tag——JSON 键是 Go 字段名（大写开头）；
        Breached 的 tag 是 breached。
      required: [Metric, breached, Detail]
      properties:
        Metric:
          type: string
          description: 护栏指标名（Go 字段名直出，无 json tag）。
        breached:
          type: boolean
        Detail:
          type: string
          description: 违约说明（Go 字段名直出，无 json tag）。
    Decision:
      type: object
      description: >-
        固定样本决策门的输出。只在预注册分析点（窗口关闭、alpha/power/MDE/
        最小运行时间事先固定）有效；对累积数据反复调用并据此提前宣称胜利
        是 p 值偷看，被明确禁止。
      required: [verdict, reasons]
      properties:
        verdict:
          type: string
          enum: [ship, rollback, continue, hold]
        reasons:
          type: array
          description: 有序的人类可读解释。
          items:
            type: string
        guardrailBreaches:
          type: array
          items:
            $ref: "#/components/schemas/GuardrailBreach"
    GuardrailBreach:
      type: object
      required: [metric, detail]
      properties:
        metric:
          type: string
        detail:
          type: string
    AIResourceRef:
      type: object
      description: 所有权索引：逻辑名（租户内）→ 服务端生成的全局唯一 physical ID。
      required: [workspaceId, environmentId, type, logicalId, physicalId, owner, createdAt]
      properties:
        workspaceId:
          type: string
        environmentId:
          type: string
        type:
          type: string
          enum: [prompt, skill, agentspec]
        logicalId:
          type: string
        physicalId:
          type: string
          description: 服务端生成、全局唯一（gonacos AI 资源无 namespace 字段）。
        owner:
          type: string
        createdAt:
          type: string
          format: date-time
    PinnedVersion:
      type: object
      description: 发布时绑定的不可变资源版本。
      required:
        - workspaceId
        - environmentId
        - type
        - logicalId
        - physicalId
        - version
        - digest
        - pinnedAt
        - pinnedBy
      properties:
        workspaceId:
          type: string
        environmentId:
          type: string
        type:
          type: string
        logicalId:
          type: string
        physicalId:
          type: string
        version:
          type: string
        digest:
          type: string
          description: gonacos 版本元数据的 MD5 hex。
        pinnedAt:
          type: string
          format: date-time
        pinnedBy:
          type: string
    AIContent:
      type: object
      description: 一份已解析、摘要校验通过的资源版本内容。
      required: [type, logicalId, physicalId, version, digest, content, resolvedAt]
      properties:
        type:
          type: string
        logicalId:
          type: string
        physicalId:
          type: string
        version:
          type: string
        digest:
          type: string
        content:
          type: string
        resolvedAt:
          type: string
          format: date-time
    AIResourcesResponse:
      type: object
      required: [resources, revocations]
      properties:
        resources:
          type: array
          items:
            $ref: "#/components/schemas/AIResourceRef"
        revocations:
          type: object
          description: 活跃撤销表：键为 type 与 logicalId 的内部拼接，值为撤销原因（附操作者）。
          additionalProperties:
            type: string
    RegisterAIResourceRequest:
      type: object
      additionalProperties: false
      required: [type, logicalId, name]
      properties:
        type:
          type: string
          enum: [prompt, skill, agentspec]
          description: mcp/pipeline 被拒绝（无不可变版本语义）。
        logicalId:
          type: string
          description: "[a-z0-9-] slug。"
        name:
          type: string
    PinAIVersionRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          description: 新版本原始内容（发布后读回验证并计算 MD5）。
        approvalId:
          type: string
          description: 与 content 摘要一致的有效审批记录 ID。
    RevokeAIResourceRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          description: 撤销原因（必填，空 → 400）。
    AIRevokeResponse:
      type: object
      required: [status, type, logicalId, reviewId]
      properties:
        status:
          type: string
          example: revoked
        type:
          type: string
        logicalId:
          type: string
        reviewId:
          type: string
    AIReinstateResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: reinstated
    ModelAllowEntry:
      type: object
      description: provider/model 白名单的一行；未入白名单的 modelRef flag 无法发布。
      required: [workspaceId, provider, model, enabled, createdAt, createdBy]
      properties:
        workspaceId:
          type: string
        provider:
          type: string
        model:
          type: string
        params:
          type: object
          description: 受限默认参数。
          additionalProperties:
            type: string
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
    SetModelAllowlistRequest:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ModelAllowEntry"
    ResourceRequest:
      type: object
      additionalProperties: false
      required: [type, logicalId]
      properties:
        type:
          type: string
        logicalId:
          type: string
        version:
          type: string
          description: 缺省解析当前 pin 的版本。
    SessionFreezeRequest:
      type: object
      additionalProperties: false
      required: [sessionId, context, flagKeys]
      properties:
        sessionId:
          type: string
          description: 必填（空 → 400）。
        taskId:
          type: string
        context:
          $ref: "#/components/schemas/EvaluationContext"
        flagKeys:
          type: array
          items:
            type: string
        resources:
          type: array
          description: 除自动发现（promptRef/resourceRef）外显式请求的资源。
          items:
            $ref: "#/components/schemas/ResourceRequest"
    SessionSnapshot:
      type: object
      description: >-
        冻结的每任务配置：一次求值 + 资源版本冻结。长任务把它带在上下文里；
        新配置只影响后续会话。
      required:
        - sessionId
        - workspaceId
        - environmentId
        - manifestRevision
        - frozenAt
        - evaluations
        - resources
        - modelRefs
      properties:
        sessionId:
          type: string
        taskId:
          type: string
        workspaceId:
          type: string
        environmentId:
          type: string
        manifestRevision:
          type: integer
          format: int64
        frozenAt:
          type: string
          format: date-time
        evaluations:
          type: object
          description: flagKey → 冻结时的求值结果。
          additionalProperties:
            $ref: "#/components/schemas/Result"
        resources:
          type: array
          description: 全部解析并摘要校验通过的资源（任一失败则整体失败）。
          items:
            $ref: "#/components/schemas/AIContent"
        modelRefs:
          type: array
          description: 已解析的白名单 modelRef 条目。
          items:
            $ref: "#/components/schemas/ModelAllowEntry"
    CheckRequest:
      type: object
      additionalProperties: false
      required: [resources]
      properties:
        resources:
          type: array
          items:
            $ref: "#/components/schemas/ResourceRequest"
    CheckStatus:
      type: object
      required: [type, logicalId, blocked]
      properties:
        type:
          type: string
        logicalId:
          type: string
        blocked:
          type: boolean
        reason:
          type: string
          description: 撤销原因（仅 blocked=true 时出现，omitempty）。
    CheckResponse:
      type: object
      required: [resources, anyBlocked]
      properties:
        resources:
          type: array
          items:
            $ref: "#/components/schemas/CheckStatus"
        anyBlocked:
          type: boolean
          description: true 时 HTTP 状态为 423——执行必须停止。
    EvalRequest:
      type: object
      additionalProperties: false
      required: [flagKey, context]
      properties:
        flagKey:
          type: string
        context:
          $ref: "#/components/schemas/EvaluationContext"
    EvalResponse:
      type: object
      required: [result, value, manifestRevision]
      properties:
        result:
          $ref: "#/components/schemas/Result"
        value:
          description: result.value 的便捷副本（任意 JSON）。
        manifestRevision:
          type: integer
          format: int64
        exposureEventId:
          type: string
          description: >-
            服务端落下曝光时返回（omitempty）：对
            (experiment, epoch, unit, variant) 确定性生成，重复求值幂等。
        randomizationUnit:
          type: string
          description: >-
            曝光所归因的规范单元字符串（仅落了曝光时出现，omitempty）——
            供转化事件对齐同一 unit 哈希；值来自调用方自身上下文。
    RevisionResponse:
      type: object
      required: [revision, etag]
      properties:
        revision:
          type: integer
          format: int64
          description: 当前 manifest revision；从未发布过 manifest 的环境为 0。
        etag:
          type: string
          description: 对应实体标签（"golab-r<revision>"）。
    CollectEvent:
      type: object
      additionalProperties: false
      description: >-
        一条曝光/转化事件。unit 必填明文（服务端 HMAC 伪名化，原值不落盘）；
        缺 unit 的事件被跳过并计入 rejected。
      required: [eventId, type, experimentId, epoch, variant, unit, clientTime]
      properties:
        eventId:
          type: string
          description: 幂等去重键；重复计入 duplicates。
        decisionId:
          type: string
          description: 关联原始求值、曝光及转化；缺省时事件仍按原有规则处理。
        type:
          type: string
          enum: [exposure, conversion]
        experimentId:
          type: string
        epoch:
          type: integer
          format: int64
          description: 与实验注册不符 → rejected。
        flagKey:
          type: string
        flagRevision:
          type: integer
          format: int64
        variant:
          type: string
        unit:
          type: string
          description: 随机化单元明文；服务端做租户内 HMAC-SHA256 后存储。
        source:
          type: string
          description: 曝光来源 split|bandit|bandit-fallback|targeting|default。
        policyVersion: { type: string }
        stateVersion: { type: integer, format: int64 }
        allocationProbability: { type: number, minimum: 0, maximum: 1 }
        metricKey:
          type: string
          description: 转化事件的指标键。
        value:
          type: number
          description: 转化值（mean 指标用）。
        sessionId:
          type: string
        taskId:
          type: string
        clientTime:
          type: string
          format: date-time
          description: 迟到超 72h 或超前 5min → rejected。
    CollectRequest:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          description: 空数组返回全零结果；条数超工作空间配额 → 400 batch_too_large。
          items:
            $ref: "#/components/schemas/CollectEvent"
    CollectResponse:
      type: object
      required: [accepted, duplicates, rejected]
      properties:
        accepted:
          type: integer
        duplicates:
          type: integer
        rejected:
          type: integer
          description: 含缺 unit 被跳过的事件数。
        rejectMessages:
          type: array
          nullable: true
          description: 拒绝原因（无拒绝时可能缺省或为 null）。
          items:
            type: string
