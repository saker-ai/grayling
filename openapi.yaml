      tags: [sdk, ai]
      summary: SDK 侧资源解析（作用域=凭证环境；摘要校验后返回内容）
      description: >-
        SDK 凭证是服务端凭证——原始 AI 内容绝不发往浏览器。请求只能指名
        凭证所属环境内注册的资源；跨租户/未 pin/已撤销一律 404。
