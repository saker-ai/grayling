          description: 已接受事件的聚合计数。
          content:
            application/json:
              schema:
                type: object
                properties:
                  exposures: {type: integer, format: int64}
                  conversions: {type: integer, format: int64}
        "401":
          $ref: "#/components/responses/Unauthorized"
