openapi: 3.0.3
info:
  title: GoLab API
  version: v1
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: |-
    GoLab 功能灰度 / AB 实验平台的 HTTP API（权威路由清单：`internal/api/server.go` 的 `Handler()`）。

    ## 认证与受众（三受众互斥）

    所有端点（除 `GET /api/v1/health`）要求 `Authorization: Bearer <token>`。
    凭证 secret 前缀标识受众，受众之间互斥——持错误受众的凭证访问端点返回
    `403 wrong_audience`：

    | 受众 | secret 前缀 | 可访问端点 |
    |---|---|---|
    | admin | `glab_admin_` | `/api/v1/admin/**` |
    | sdk | `glab_sdk_` | `/api/v1/sdk/**` |
    | collect | `glab_collect_` | `/api/v1/collect` |

    租户作用域（workspace/environment）**完全由凭证决定**：任何端点都不接受
    通过 query 参数或 body 字段选择租户。`{ws}`/`{env}` 路径参数接受 slug 或
    服务端生成的内部 ID。管理角色（admin 凭证）：owner、publisher、analyst、
    viewer；高风险草稿禁止提交人自批（403 `self_approval_denied`）。

    ## 错误约定

    错误响应统一为 `{"error":{"code":"...","message":"..."}}`（见
    `ErrorResponse`）。存储层错误到 HTTP 状态的映射（`writeStoreError`）：
    `not_found`→404，`exists`/`conflict`/`invalid_state`→409，
    `access_denied`/`self_approval_denied`→403，`quota_exceeded`→429，
    `validation_failed`→400，其余→500 `internal`。认证层：`unauthorized`→401，
    `wrong_audience`→403，`rate_limited`→429。AI 端点：`ai_unavailable`→501；
    跨租户 AI 读取一律 404（不泄露存在性）。采集：`batch_too_large`→400。
    gff 导入：`import_failed`→400。SSE：连接数配额满 → 503 `sse_cap`。

    ## 类型约定

    - 请求体使用严格解码（`DisallowUnknownFields`）：未知字段 →
      `400 validation_failed`，因此所有请求体 schema 标注
      `additionalProperties: false`。
    - Go `time.Duration` 字段序列化为**整数纳秒**（int64），如 `minRuntime`、
      `analysisWindow`、`eventRetention`、`observationWindow`。
    - Go `time.Time` 字段序列化为 RFC 3339 字符串（`date-time`）。
    - `platform.CreatedToken` 无 json tag，故其响应字段是 Go 字段名
      `Token` / `Secret`（大写开头，secret 仅在创建时返回一次）。
    - `stats.GuardrailCheck` 的 `Metric`/`Detail` 无 json tag（大写开头），
      `Breached` 为 `breached`。

    ## 独立 proxy（cmd/golab-proxy）

    proxy 以**相同路径**无状态中继数据面子集到上游 GoLab server：
    `POST /api/v1/sdk/eval`、`GET /api/v1/sdk/stream`（逐块 flush 的 SSE
    中继，客户端断开即取消上游订阅）、`GET /api/v1/sdk/config`（ETag/304
    透传）、`GET /api/v1/sdk/revision`（受限新鲜度探针）、
    `POST /api/v1/collect`。proxy 自有端点：`GET /healthz`
    （liveness，不探测上游）与 `GET /api/v1/health`（readiness，探测上游，
    不可达 → 503）。管理 API（`/api/v1/admin/**`，含 AI 端点）与
    `POST /api/v1/sdk/ai/**` 一律不转发（404）。凭证原样透传：认证、
    受众分离与限流仍由上游执行。
    错误映射：上游不可达 → 502 `upstream_unreachable`；一元请求超时 →
    504 `upstream_timeout`；其余状态与响应体按上游原样透传。
servers:
  - url: http://127.0.0.1:8688
    description: GoLab server（默认本地部署，全部端点）
  - url: http://127.0.0.1:8689
    description: >-
      cmd/golab-proxy 无状态中继——仅同路径转发 POST /api/v1/sdk/eval、
      GET /api/v1/sdk/stream、GET /api/v1/sdk/config、
      GET /api/v1/sdk/revision、POST /api/v1/collect，
      另有自有 GET /healthz（liveness）与 GET /api/v1/health（readiness，
      探测上游）。所有 /api/v1/admin/** 与 POST /api/v1/sdk/ai/**
      不被转发（404）。
security:
  - bearerAuth: []
tags:
  - name: health
    description: 存活/健康检查（无鉴权）
  - name: workspaces
    description: 工作空间、环境、凭证、审计与配额（admin 凭证）
  - name: flags
    description: Flag 生命周期（草稿/评审/发布/回滚/删除/gff 导入）
  - name: segments
    description: Segment 生命周期（草稿/评审/发布）
  - name: experiments
    description: 实验预注册、评审、绑定、状态迁移与分析报告
  - name: release-plans
    description: 分阶段放量计划（自动推进引擎的操作面）
  - name: ai
    description: AI 资源治理（注册/固定版本/紧急撤销/解析/模型白名单）
  - name: sdk
    description: SDK 数据面（sdk 凭证：快照、revision 探针、远程求值、SSE、AI）
  - name: collect
    description: 曝光/转化事件采集（collect 凭证）
paths:
  "/api/v1/health":
    get:
      tags: [health]
      summary: 健康检查（无鉴权）
      operationId: getHealth
      security: []
      responses:
        "200":
          description: 服务存活。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  "/api/v1/admin/rollout/leadership":
    get:
      tags: [experiments]
      summary: 查看自动推进引擎当前持有者与最近执行状态
      operationId: getRolloutLeadership
      responses:
        "200":
          description: 持有者、generation、租约过期时间、最近执行与接管时间及错误。
          content:
            application/json:
              schema:
                type: object
                properties:
                  holder: {type: string}
                  generation: {type: integer, format: int64}
                  expiresAt: {type: string, format: date-time}
                  lastRunAt: {type: string, format: date-time}
                  lastTakeoverAt: {type: string, format: date-time}
                  lastError: {type: string}
        "503":
          description: PostgreSQL 不可用，无法确认选主状态。
  "/api/v1/admin/workspaces":
    post:
      tags: [workspaces]
      summary: 创建工作空间（仅全局 owner）
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: 已创建。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      tags: [workspaces]
      summary: 列出工作空间（作用域 admin 只见本工作空间）
      operationId: listWorkspaces
      responses:
        "200":
          description: 工作空间列表。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  "/api/v1/admin/workspaces/{ws}/environments":
    post:
      tags: [workspaces]
      summary: 创建环境
      operationId: createEnvironment
      parameters:
        - $ref: "#/components/parameters/WsPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvironmentRequest"
      responses:
        "201":
          description: 已创建（含服务端生成的 gonacos namespaceId）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      tags: [workspaces]
      summary: 列出环境
      operationId: listEnvironments
      parameters:
        - $ref: "#/components/parameters/WsPath"
      responses:
        "200":
          description: 环境列表。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Environment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  "/api/v1/admin/workspaces/{ws}/tokens":
    post:
      tags: [workspaces]
      summary: 铸造凭证（secret 仅此一次返回）
      description: >-
        凭证总是作用域绑定到路径中的工作空间；全局 owner 凭证只能由
        cmd/golab 引导铸造，不能经此端点获得（工作空间 owner 无法提权为全局）。
        kind=admin 时 role 必填（owner/publisher/analyst/viewer）；
        kind=sdk/collect 时 environment 必填（slug 或 ID）。
      operationId: createToken
      parameters:
        - $ref: "#/components/parameters/WsPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: 已创建；明文 secret 仅此一次返回。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      tags: [workspaces]
      summary: 列出凭证（不含明文 secret）
      operationId: listTokens
      parameters:
        - $ref: "#/components/parameters/WsPath"
      responses:
        "200":
          description: 凭证列表。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Token"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  "/api/v1/admin/tokens/{id}":
    delete:
      tags: [workspaces]
      summary: 吊销凭证（注意：路径不含 {ws}）
      description: >-
        对象级校验：作用域 owner 只能吊销本工作空间的凭证；全局凭证
        （workspaceId 为空）只能由全局 owner 吊销（否则 403 access_denied）。
      operationId: revokeToken
      parameters:
        - $ref: "#/components/parameters/TokenIdPath"
      responses:
        "200":
          description: 已吊销。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRevokeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  "/api/v1/admin/workspaces/{ws}/audit":
    get:
      tags: [workspaces]
      summary: 审计日志（新→旧）
      operationId: listAudit
      parameters:
        - $ref: "#/components/parameters/WsPath"
        - $ref: "#/components/parameters/AuditLimitQuery"
      responses:
        "200":
          description: 审计条目列表。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  "/api/v1/admin/workspaces/{ws}/quotas":
    get:
      tags: [workspaces]
      summary: 读取工作空间当前配额（owner；未设置时返回默认值）
      operationId: getQuotas
      parameters:
        - $ref: "#/components/parameters/WsPath"
      responses:
        "200":
          description: 当前生效的配额。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotas"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      tags: [workspaces]
      summary: 设置工作空间配额（owner）
      operationId: setQuotas
      parameters:
        - $ref: "#/components/parameters/WsPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Quotas"
      responses:
        "200":
          description: 已生效的配额。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotas"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  "/api/v1/admin/workspaces/{ws}/environments/{env}/flags":
    get:
      tags: [flags]
      summary: 列出 flag（含草稿与当前 revision 的控制台读模型）
      operationId: listFlags
      parameters:
        - $ref: "#/components/parameters/WsPath"
        - $ref: "#/components/parameters/EnvPath"
      responses:
        "200":
          description: FlagView 列表。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlagView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  "/api/v1/admin/workspaces/{ws}/environments/{env}/flags/{key}":
    get:
      tags: [flags]
      summary: Flag 详情（含草稿、当前 revision、全部历史）
      operationId: getFlag
      parameters:
        - $ref: "#/components/parameters/WsPath"
        - $ref: "#/components/parameters/EnvPath"
        - $ref: "#/components/parameters/FlagKeyPath"
      responses:
        "200":
          description: Flag 读模型。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags: [flags]
      summary: 标记删除（仍需 submit→approve→publish 落 tombstone）
      operationId: markFlagDeleted
      parameters:
        - $ref: "#/components/parameters/WsPath"
        - $ref: "#/components/parameters/EnvPath"
        - $ref: "#/components/parameters/FlagKeyPath"
      responses:
        "200":
          description: 已标记；后续走正常评审发布流程落 tombstone。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagDeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  "/api/v1/admin/workspaces/{ws}/environments/{env}/flags/{key}/draft":
    put:
      tags: [flags]
      summary: 保存 flag 草稿
      description: >-
        `content.key` 必须等于路径 `{key}`（改名在 v1 是删除+新建，不是草稿
        操作）。`baseRevision > 0` 时启用乐观锁：目标 revision 已被别人推进 →
        409 conflict。高风险（risk=high）草稿的提交人不能自批。
      operationId: saveFlagDraft
      parameters:
        - $ref: "#/components/parameters/WsPath"
        - $ref: "#/components/parameters/EnvPath"
        - $ref: "#/components/parameters/FlagKeyPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveFlagDraftRequest"
      responses:
        "200":
          description: 保存后的草稿。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagDraft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  "/api/v1/admin/workspaces/{ws}/environments/{env}/flags/{key}/submit":
    post:
      tags: [flags]
      summary: 提交草稿进入评审（editing→submitted）
      operationId: submitFlagDraft
      parameters:
        - $ref: "#/components/parameters/WsPath"
        - $ref: "#/components/parameters/EnvPath"
        - $ref: "#/components/parameters/FlagKeyPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRequest"
      responses:
        "200":
          description: 状态迁移成功。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  "/api/v1/admin/workspaces/{ws}/environments/{env}/flags/{key}/approve":
    post:
      tags: [flags]
      summary: 批准草稿（submitted→approved；所有风险等级禁止自批）
      operationId: approveFlagDraft
      parameters:
        - $ref: "#/components/parameters/WsPath"
        - $ref: "#/components/parameters/EnvPath"
        - $ref: "#/components/parameters/FlagKeyPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteRequest"
      responses:
        "200":
          description: 状态迁移成功。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  "/api/v1/admin/workspaces/{ws}/environments/{env}/flags/{key}/reject":
    post:
      tags: [flags]
      summary: 驳回草稿（submitted→editing）
      operationId: rejectFlagDraft
      parameters:
        - $ref: "#/components/parameters/WsPath"
        - $ref: "#/components/parameters/EnvPath"
        - $ref: "#/components/parameters/FlagKeyPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteRequest"
      responses:
        "200":
          description: 已驳回，回到 editing。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  "/api/v1/admin/workspaces/{ws}/environments/{env}/flags/{key}/publish":
    post:
      tags: [flags]
      summary: 发布已批准草稿（不可变 revision + manifest 推进 + SSE 通知）
      operationId: publishFlag
      parameters:
        - $ref: "#/components/parameters/WsPath"
        - $ref: "#/components/parameters/EnvPath"
        - $ref: "#/components/parameters/FlagKeyPath"
      requestBody:
        required: false
