  "/api/v1/sdk/config":
    get:
      tags: [sdk]
      summary: 作用域全量快照（ETag/If-None-Match → 304）
      description: >-
        workspace/environment 只来自 sdk 凭证，无任何租户选择参数。响应是该
        环境的完整服务端快照（Snapshot）；浏览器侧应改用受限投影
        （/sdk/revision）或远程求值（/sdk/eval）。ETag 即 manifest revision
        （形如 "golab-r<revision>"），带匹配 If-None-Match 的请求得到 304。
        响应头恒为 Cache-Control: no-store。快照损坏 → 500 snapshot_invalid
        （客户端保留上一份好快照）。
      operationId: getSDKConfig
      parameters:
        - $ref: "#/components/parameters/IfNoneMatchHeader"
      responses:
        "200":
          description: 当前快照。
          headers:
            ETag:
              description: 快照实体标签（"golab-r<manifestRevision>"）。
              schema:
                type: string
            Cache-Control:
              description: 恒为 no-store。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "304":
          description: If-None-Match 命中——客户端缓存仍是当前 revision；空 body。
          headers:
            ETag:
              description: 当前实体标签。
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  "/api/v1/sdk/revision":
    get:
      tags: [sdk]
      summary: 最小新鲜度探针（受限投影：只有 revision 与 etag）
      description: >-
        只返回凭证作用域的当前 manifest revision——不含 flags/rules/segments。
        远程求值 SDK（浏览器相邻运行时）轮询此端点判断缓存的求值结果是否基于
        已被取代的配置，从而在不下载全量快照的情况下失效重估。尚未发布过
        manifest 的环境返回 revision 0。响应头 Cache-Control: no-store。
        cmd/golab-proxy 以相同路径中继此端点（一元转发）。
      operationId: getSDKRevision
      responses:
        "200":
          description: 当前 revision 与对应 etag。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionResponse"
