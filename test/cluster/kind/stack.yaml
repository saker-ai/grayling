apiVersion: v1
kind: Namespace
metadata:
  name: golab-issue13
---
apiVersion: v1
kind: Pod
metadata:
  name: postgres
  namespace: golab-issue13
  labels: {app: postgres}
spec:
  nodeSelector: {kubernetes.io/hostname: golab-issue13-worker}
  containers:
    - name: postgres
      image: postgres:16-alpine
      imagePullPolicy: Never
      env:
        - {name: POSTGRES_USER, value: golab}
        - {name: POSTGRES_DB, value: golab}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: issue13-secrets, key: pg-password}}
      ports: [{name: postgres, containerPort: 5432}]
      readinessProbe: {exec: {command: [pg_isready, -U, golab, -d, golab]}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: golab-issue13}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: postgres}]
---
apiVersion: v1
kind: Pod
metadata:
  name: redis
  namespace: golab-issue13
  labels: {app: redis}
spec:
  nodeSelector: {kubernetes.io/hostname: golab-issue13-worker2}
  containers:
    - name: redis
      image: redis:8-alpine
      imagePullPolicy: Never
      ports: [{name: redis, containerPort: 6379}]
      readinessProbe: {exec: {command: [redis-cli, ping]}}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: golab-issue13}
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: redis}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: native-allow-listed-clients, namespace: golab-issue13}
spec:
  podSelector: {matchLabels: {app: golab}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {native-access: allowed}}
      ports:
        - {protocol: TCP, port: 8848}
        - {protocol: TCP, port: 9848}
---
apiVersion: v1
kind: Pod
metadata:
  name: allowed-a
  namespace: golab-issue13
  labels: {native-access: allowed}
spec:
  nodeSelector: {kubernetes.io/hostname: golab-issue13-worker2}
  containers:
    - {name: probe, image: busybox:1.36, imagePullPolicy: Never, command: [sleep, "36000"]}
---
apiVersion: v1
kind: Pod
metadata:
  name: denied-a
  namespace: golab-issue13
  labels: {native-access: denied}
spec:
  nodeSelector: {kubernetes.io/hostname: golab-issue13-worker2}
  containers:
    - {name: probe, image: busybox:1.36, imagePullPolicy: Never, command: [sleep, "36000"]}
---
apiVersion: v1
kind: Pod
metadata:
  name: allowed-b
  namespace: golab-issue13
  labels: {native-access: allowed}
spec:
  nodeSelector: {kubernetes.io/hostname: golab-issue13-worker}
  containers:
    - {name: probe, image: busybox:1.36, imagePullPolicy: Never, command: [sleep, "36000"]}
---
apiVersion: v1
kind: Pod
metadata:
  name: denied-b
  namespace: golab-issue13
  labels: {native-access: denied}
spec:
  nodeSelector: {kubernetes.io/hostname: golab-issue13-worker}
  containers:
    - {name: probe, image: busybox:1.36, imagePullPolicy: Never, command: [sleep, "36000"]}
